# CodeTrace local infrastructure.
#   PostgreSQL only (typical development):   docker compose up -d postgres
#   Full stack in containers (optional):     docker compose --profile app up -d --build
# Values come from .env (copy .env.example); the defaults below are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: codetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codetrace}
      POSTGRES_USER: ${POSTGRES_USER:-codetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codetrace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codetrace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: codetrace-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codetrace}
      DB_USERNAME: ${POSTGRES_USER:-codetrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-codetrace}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      RETENTION_STORE_SOURCE: ${RETENTION_STORE_SOURCE:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: codetrace-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  codetrace-pgdata:
